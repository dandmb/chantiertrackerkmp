# Play Store release: on a version tag (v1.0.0), run the test suite, build the Android App
# Bundle signed with the upload key, check it, keep it as an artifact, and send it to the
# internal testing track when a Play service account is configured. See MOBILE_CONTEXT §15.
#
# Secrets (repo or `production` environment):
#   RELEASE_KEYSTORE_BASE64     base64 of the upload keystore (.jks), never the staging one
#   RELEASE_KEYSTORE_PASSWORD   / RELEASE_KEY_ALIAS / RELEASE_KEY_PASSWORD
#   FIREBASE_RELEASE_APP_ID     Firebase Android App ID registered for com.dmb.chantiertracker
#   FIREBASE_RELEASE_API_KEY    its "current_key" (google-services.json)
#   FIREBASE_PROJECT_ID         its "project_id"
#                               (the three Firebase values switch Crashlytics on; without them
#                               the bundle is built with crash reports off, and a warning says so)
#   PLAY_SERVICE_ACCOUNT_JSON   optional: RAW JSON key of a service account invited in the Play
#                               Console with the release permission. Absent: artifact only.
#
# Variable (optional): PLAY_RELEASE_STATUS, `draft` by default (required while the app has
# never been published), `completed` once the store listing is live.

name: Release — Android

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: release-android
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/shared-tests.yml
    with:
      run-ios: false

  bundle:
    name: Build, sign & ship the App Bundle
    needs: tests
    runs-on: ubuntu-latest
    environment: production
    env:
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Read the version from the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          [[ "$name" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Decode upload keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$RELEASE_KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"

      - name: Build release App Bundle
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/upload.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          FIREBASE_RELEASE_APP_ID: ${{ secrets.FIREBASE_RELEASE_APP_ID }}
          FIREBASE_RELEASE_API_KEY: ${{ secrets.FIREBASE_RELEASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_RELEASE_APP_ID" ] || [ -z "$FIREBASE_RELEASE_API_KEY" ] || [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "::warning::Firebase release values missing, this bundle has no crash reports."
          fi
          ./gradlew :androidApp:bundleRelease \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="${{ steps.version.outputs.name }}" \
            --stacktrace

      - name: Check the bundle
        run: |
          .github/scripts/check-release-aab.sh \
            androidApp/build/outputs/bundle/release/androidApp-release.aab \
            "${{ steps.version.outputs.name }}"

      - name: Archive App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: chantiertracker-${{ steps.version.outputs.name }}-${{ github.run_number }}
          path: androidApp/build/outputs/bundle/release/androidApp-release.aab
          if-no-files-found: error

      - name: Send to the internal testing track
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON != '' }}
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.dmb.chantiertracker
          releaseFiles: androidApp/build/outputs/bundle/release/androidApp-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ github.run_number }})
          track: internal
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

      - name: Artifact only
        if: ${{ env.PLAY_SERVICE_ACCOUNT_JSON == '' }}
        run: echo "::notice::No PLAY_SERVICE_ACCOUNT_JSON secret, the App Bundle is kept as an artifact only."

      - name: Clean up credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/upload.jks"
