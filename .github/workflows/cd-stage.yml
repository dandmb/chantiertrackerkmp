# Continuous delivery for the `stage` branch: on every merge, run the test
# suite, build the signed staging APK and hand it to the testers via Firebase
# App Distribution. See MOBILE_CONTEXT §14 / ADR-24.
#
# Required secrets (repo or `stage` environment):
#   FIREBASE_APP_ID            Firebase Android App ID, e.g. 1:123...:android:abc...
#                              (registered for the package com.dmb.chantiertracker.staging)
#   FIREBASE_SERVICE_ACCOUNT   full JSON key of a service account with the
#                              "Firebase App Distribution Admin" role
#   FIREBASE_TESTER_GROUP      tester group alias to distribute to
#   ANDROID_KEYSTORE_BASE64    base64 of the distribution keystore (.jks)
#   ANDROID_KEYSTORE_PASSWORD  / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD

name: CD — stage

on:
  push:
    branches: [stage]

concurrency:
  group: cd-stage
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tests:
    # iOS is already covered on `dev` before code reaches `stage`.
    uses: ./.github/workflows/shared-tests.yml
    with:
      run-ios: false

  distribute:
    name: Build & distribute (Firebase App Distribution)
    needs: tests
    runs-on: ubuntu-latest
    environment: stage
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode distribution keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/distribution.jks"

      - name: Build staging APK
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/distribution.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          version_name="1.0-stage.${{ github.run_number }}+${GITHUB_SHA::7}"
          ./gradlew :androidApp:assembleStaging \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="$version_name" \
            --stacktrace

      - name: Locate APK
        id: apk
        run: |
          apk=$(find androidApp/build/outputs/apk/staging -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)
          test -n "$apk" || { echo "::error::no signed staging APK produced"; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Distribute to Firebase App Distribution
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_TESTER_GROUP: ${{ secrets.FIREBASE_TESTER_GROUP }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          notes="$(git log -1 --pretty=%s) (${GITHUB_SHA::7})"
          npx --yes firebase-tools@latest appdistribution:distribute "${{ steps.apk.outputs.path }}" \
            --app "$FIREBASE_APP_ID" \
            --groups "$FIREBASE_TESTER_GROUP" \
            --release-notes "$notes"

      - name: Clean up credentials
        if: ${{ always() }}
        run: rm -f "$RUNNER_TEMP/distribution.jks" "$RUNNER_TEMP/firebase-service-account.json"

      - name: Archive APK
        if: ${{ !cancelled() && steps.apk.outputs.path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: chantiertracker-staging-${{ github.run_number }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: warn
