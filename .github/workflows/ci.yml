# Runs the shared module's automated test suite on every push to `dev`
# (i.e. every merge) and on every pull request targeting `dev`.
#
# Two jobs run in parallel:
#   - jvm-android (ubuntu): :shared:jvmTest + :shared:testAndroidHostTest
#   - ios (macOS arm64):    :shared:iosSimulatorArm64Test
#
# The opt-in backend integration tests (DesktopAuthIntegrationTest,
# -Dchantiertracker.integrationTests=true) are NOT run here — they need a
# live local backend and stay a manual/local check for now.

name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jvm-android:
    name: JVM + Android host tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Populate the shared cache from pushes to dev; keep PR runs read-only.
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: JVM tests (:shared:jvmTest)
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Android host tests (:shared:testAndroidHostTest)
        # Run even if the JVM step failed, so a single CI run surfaces both.
        if: ${{ !cancelled() }}
        run: ./gradlew :shared:testAndroidHostTest --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: jvm-android-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn

  ios:
    name: iOS simulator tests
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        # The shared module applies the Android KMP plugin, so Gradle needs the
        # SDK to configure the project even for the iOS-only test task.
        uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-36 build-tools;36.0.0"

      - name: Cache Kotlin/Native (~/.konan)
        uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: konan-${{ runner.os }}-

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: iOS simulator tests (:shared:iosSimulatorArm64Test)
        run: ./gradlew :shared:iosSimulatorArm64Test --stacktrace

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
          if-no-files-found: warn
